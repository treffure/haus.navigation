<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />

  <title>Indoor Navigation Mockup (Web · A-Frame · Kamera)</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <style>
    :root{
      --text: rgba(240, 248, 255, .95);
      --muted: rgba(170, 200, 255, .9);
      --neon: #33a7ff;
      --neon2:#2df0ff;
      --shadow: 0 18px 60px rgba(0,0,0,.45);
      --radius: 18px;
    }

    html, body {
      height: 100%;
      margin: 0;
      background: #05070d;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    #video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
      z-index: 0;
      filter: contrast(1.05) saturate(1.1);
    }

    #vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(1200px 700px at 50% 30%, rgba(51,167,255,.18), transparent 55%),
        radial-gradient(900px 500px at 20% 70%, rgba(45,240,255,.10), transparent 60%),
        linear-gradient(to bottom, rgba(0,0,0,.15), rgba(0,0,0,.55));
      mix-blend-mode: screen;
    }

    #aframeWrap{
      position: fixed;
      inset: 0;
      z-index: 2;
    }

    #overlay {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      padding: 18px;
      background: transparent;
      pointer-events: none;
    }

    .card {
      width: min(520px, 100%);
      background: linear-gradient(180deg, rgba(12,18,34,.78), rgba(10,16,28,.66));
      border: 1px solid rgba(51,167,255,.35);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      pointer-events: auto;
      transform: translateY(10px);
      opacity: 0;
      animation: popIn .7s cubic-bezier(.2,.9,.2,1) forwards;
    }

    @keyframes popIn{
      0%   { opacity: 0; transform: translateY(14px) scale(.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .cardHeader{
      padding: 18px 18px 10px;
      text-align: center;
      position: relative;
    }
    .cardHeader:before{
      content:"";
      position:absolute;
      left: 14px; right: 14px; top: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(45,240,255,.75), transparent);
      opacity: .8;
    }

    .title{
      color: var(--text);
      font-weight: 800;
      letter-spacing: .2px;
      font-size: clamp(18px, 2.7vw, 22px);
      margin: 8px 0 0;
      text-shadow: 0 0 22px rgba(51,167,255,.35);
    }

    .subtitle{
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .btnRow{
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 14px 18px 18px;
    }

    .navBtn{
      appearance: none;
      border: 0;
      cursor: pointer;
      padding: 14px 14px;
      border-radius: 14px;
      color: rgba(240,248,255,.98);
      background:
        radial-gradient(120% 130% at 20% 0%, rgba(45,240,255,.35), transparent 45%),
        linear-gradient(180deg, rgba(52,180,255,.28), rgba(52,180,255,.10));
      border: 1px solid rgba(51,167,255,.50);

      position: relative;
      overflow: hidden;

      transform: translateZ(0);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, filter .18s ease;
      box-shadow:
        0 0 0 rgba(51,167,255,0),
        0 12px 30px rgba(0,0,0,.25);
      user-select: none;

      animation: glowPulse 2.4s ease-in-out infinite;
    }

    @keyframes glowPulse{
      0%,100% { filter: brightness(1) saturate(1); }
      50%      { filter: brightness(1.15) saturate(1.1); }
    }

    .navBtn:nth-child(2){
      animation-delay: .28s;
      background:
        radial-gradient(120% 130% at 20% 0%, rgba(106,92,255,.32), transparent 45%),
        linear-gradient(180deg, rgba(106,92,255,.22), rgba(106,92,255,.10));
      border-color: rgba(106,92,255,.55);
    }

    .navBtn::after{
      content:"";
      position:absolute;
      inset:-40%;
      background: conic-gradient(from 180deg, rgba(45,240,255,.0), rgba(45,240,255,.55), rgba(51,167,255,.0));
      opacity: 0;
      transform: rotate(0deg);
      transition: opacity .2s ease;
    }

    .navBtn:hover{
      transform: translateY(-2px);
      box-shadow:
        0 0 0 1px rgba(51,167,255,.28),
        0 20px 55px rgba(0,0,0,.35);
      border-color: rgba(45,240,255,.78);
    }
    .navBtn:hover::after{
      opacity: .9;
      animation: spinSheen .8s linear infinite;
    }

    @keyframes spinSheen{
      to { transform: rotate(360deg); }
    }

    .btnLabel{
      font-weight: 850;
      font-size: 16px;
      letter-spacing: .2px;
      text-shadow: 0 0 16px rgba(51,167,255,.35);
      position: relative;
      z-index: 1;
    }

    .btnMeta{
      margin-top: 6px;
      font-size: 12px;
      color: rgba(205,230,255,.92);
      position: relative;
      z-index: 1;
    }

    .hide{
      animation: cardOut .35s ease forwards !important;
    }
    @keyframes cardOut{
      from { opacity: 1; transform: translateY(0) scale(1); }
      to   { opacity: 0; transform: translateY(12px) scale(.98); }
    }

    #status {
      position: fixed;
      left: 14px;
      bottom: 14px;
      z-index: 6;
      background: rgba(10,16,28,.62);
      border: 1px solid rgba(51,167,255,.25);
      color: rgba(230,245,255,.9);
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 12px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
      max-width: 82vw;
    }
  </style>
</head>

<body>
  <video id="video" playsinline autoplay muted></video>
  <div id="vignette"></div>

  <div id="aframeWrap">
    <a-scene
      embedded
      vr-mode-ui="false"
      renderer="antialias: true; alpha: true"
      background="transparent"
      cursor="rayOrigin: mouse"
      device-orientation-permission-ui="false"
    >
      <a-entity id="rig" position="0 1.6 0">
        <a-camera
          id="camera"
          look-controls="enabled: true"
          position="0 0 0"
          near="0.01"
          fov="70"
        ></a-camera>
      </a-entity>

      <!-- Invisible ground plane for reference -->
      <a-plane rotation="-90 0 0" position="0 0 -2" width="20" height="20" material="color:#000;opacity:0"></a-plane>

      <a-entity id="pathRoot"></a-entity>
      <a-entity id="flagRoot"></a-entity>

      <a-entity light="type: ambient; intensity: 0.55; color: #9ad8ff"></a-entity>
      <a-entity light="type: directional; intensity: 1.0; color: #33a7ff" position="0 5 2"></a-entity>
    </a-scene>
  </div>

  <div id="overlay">
    <div id="menuCard" class="card" role="dialog" aria-modal="true">
      <div class="cardHeader">
        <div class="title">Wo willst du hin?</div>
        <div class="subtitle">Neon-Pfad auf dem Boden (Mockup)</div>
      </div>
      <div class="btnRow">
        <button class="navBtn" id="btnKueche">
          <div class="btnLabel">🍽️ Küche</div>
          <div class="btnMeta">3 m → links 90° → 7 m → links 90° → 3 m</div>
        </button>
        <button class="navBtn" id="btnBad">
          <div class="btnLabel">🛁 Bad</div>
          <div class="btnMeta">Mockup (optional)</div>
        </button>
      </div>
    </div>
  </div>

  <div id="status">📷 Kamera wird aktiviert…</div>

  <script>
    const video = document.getElementById('video');
    const statusEl = document.getElementById('status');

    const pathRoot = document.getElementById('pathRoot');
    const flagRoot = document.getElementById('flagRoot');

    // Meter -> World scale (Mockup: anpassen falls nötig)
    const METER = 1.0;

    // Ziel-Checking
    let targetWorld = null;
    let arrived = false;

    async function startCamera() {
      statusEl.textContent = '📷 Kamera wird aktiviert…';
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        statusEl.textContent = '✅ Kamera aktiv. Wähle ein Ziel.';
      } catch (err) {
        console.error(err);
        statusEl.textContent = '⚠️ Kamera konnte nicht gestartet werden. HTTPS/Permission prüfen.';
      }
    }

    function clearSceneObjects() {
      while (pathRoot.firstChild) pathRoot.removeChild(pathRoot.firstChild);
      while (flagRoot.firstChild) flagRoot.removeChild(flagRoot.firstChild);
      targetWorld = null;
      arrived = false;
    }

    function addNeonSegment({ start, end, color = '#33a7ff', width = 0.07 }) {
      const startVec = new THREE.Vector3(start.x, start.y, start.z);
      const endVec = new THREE.Vector3(end.x, end.y, end.z);
      const dir = endVec.clone().sub(startVec);
      const length = dir.length();
      const mid = startVec.clone().add(endVec).multiplyScalar(0.5);

      const up = new THREE.Vector3(0,1,0);
      const dirNorm = dir.clone().normalize();
      const axis = new THREE.Vector3().crossVectors(up, dirNorm);
      const axisLenSq = axis.lengthSq();
      const angle = Math.acos(THREE.MathUtils.clamp(up.dot(dirNorm), -1, 1)) * (180 / Math.PI);

      const segRotation = (axisLenSq < 1e-6) ? '0 0 0' : `${axis.x} ${axis.y} ${axis.z} ${angle}`;

      // Glow cylinder
      const glow = document.createElement('a-cylinder');
      glow.setAttribute('radius', width * 1.9);
      glow.setAttribute('height', length);
      glow.setAttribute('position', mid);
      glow.setAttribute('rotation', segRotation);
      glow.setAttribute('material', {
        color,
        emissive: color,
        emissiveIntensity: 2.2,
        metalness: 0.0,
        roughness: 0.1,
        opacity: 0.22,
        transparent: true
      });

      // Core cylinder
      const core = document.createElement('a-cylinder');
      core.setAttribute('radius', width);
      core.setAttribute('height', length);
      core.setAttribute('position', mid);
      core.setAttribute('rotation', segRotation);
      core.setAttribute('material', {
        color,
        emissive: color,
        emissiveIntensity: 1.5,
        metalness: 0.0,
        roughness: 0.25,
        opacity: 0.95,
        transparent: true
      });

      pathRoot.appendChild(glow);
      pathRoot.appendChild(core);
    }

    function animatePulse() {
      const start = performance.now();
      function tick(now) {
        if (pathRoot && pathRoot.children && pathRoot.children.length) {
          const t = (now - start) / 1000;
          const cylinders = pathRoot.querySelectorAll('a-cylinder[material]');
          cylinders.forEach((node, i) => {
            const mat = node.getAttribute('material');
            if (!mat) return;
            const phase = i * 0.35;
            const pulse = 0.65 + 0.35 * Math.sin(t * 2.6 + phase);
            const isGlow = (Number(node.getAttribute('radius')) > 0.14);
            const base = isGlow ? 2.2 : 1.5;
            mat.emissiveIntensity = base * (isGlow ? (0.85 + 0.25*pulse) : (0.75 + 0.35*pulse));
            node.setAttribute('material', mat);
          });
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    function addGoalFlag(worldPos) {
      // Pole
      const pole = document.createElement('a-cylinder');
      pole.setAttribute('radius', 0.015);
      pole.setAttribute('height', 1.2);
      pole.setAttribute('position', { x: worldPos.x, y: 0.6, z: worldPos.z });
      pole.setAttribute('material', { color: '#e7f6ff', metalness: 0.3, roughness: 0.2 });

      // Flag cloth (neon)
      const cloth = document.createElement('a-plane');
      cloth.setAttribute('width', 0.45);
      cloth.setAttribute('height', 0.28);
      cloth.setAttribute('position', { x: worldPos.x + 0.20, y: 1.05, z: worldPos.z });
      cloth.setAttribute('rotation', '0 90 0');
      cloth.setAttribute('material', {
        color: '#2df0ff',
        emissive: '#2df0ff',
        emissiveIntensity: 1.8,
        side: 'double',
        transparent: true,
        opacity: 0.95,
        metalness: 0.0,
        roughness: 0.2
      });

      // Extra ribbon glow
      const ribbon = document.createElement('a-ring');
      ribbon.setAttribute('radiusInner', 0.18);
      ribbon.setAttribute('radiusOuter', 0.25);
      ribbon.setAttribute('rotation', '-90 0 0');
      ribbon.setAttribute('position', { x: worldPos.x, y: 0.015, z: worldPos.z });
      ribbon.setAttribute('material', {
        color: '#33a7ff',
        emissive: '#33a7ff',
        emissiveIntensity: 2.4,
        opacity: 0.35,
        transparent: true
      });

      // Arrival text
      const text = document.createElement('a-text');
      text.setAttribute('value', '❌ Noch nicht angekommen');
      text.setAttribute('align', 'center');
      text.setAttribute('color', '#eaf7ff');
      text.setAttribute('position', { x: worldPos.x, y: 1.45, z: worldPos.z });
      text.setAttribute('width', 2.2);
      text.setAttribute('visible', 'true');

      // Add
      flagRoot.appendChild(ribbon);
      flagRoot.appendChild(pole);
      flagRoot.appendChild(cloth);
      flagRoot.appendChild(text);

      // Windy flag animation
      let phase = Math.random() * 10;
      const clothAnim = () => {
        if (!cloth.isConnected) return;
        phase += 0.03;
        const yaw = Math.sin(phase) * 18; // degrees
        cloth.setAttribute('rotation', `0 ${90 + yaw} 0`);
        requestAnimationFrame(clothAnim);
      };
      requestAnimationFrame(clothAnim);

      // Return handle
      return { textEl: text };
    }

    // Komponente: Abstand zur Zielposition prüfen
    function startArrivalWatcher() {
      const cam = document.getElementById('camera');
      const tick = () => {
        if (targetWorld && cam && cam.object3D) {
          const camWorld = new THREE.Vector3();
          cam.object3D.getWorldPosition(camWorld);

          // Nur horizontal messen (y ignorieren)
          const dx = camWorld.x - targetWorld.x;
          const dz = camWorld.z - targetWorld.z;
          const dist = Math.sqrt(dx*dx + dz*dz);

          const threshold = 0.55; // Anpassen: wie „nah“ ist angekommen?
          const flagText = flagRoot.querySelector('a-text');

          if (!arrived && dist <= threshold) {
            arrived = true;
            if (flagText) flagText.setAttribute('value', '✅ Ziel erreicht!');
            statusEl.textContent = '🎉 ✅ Du hast die Küche erreicht!';
          }

          // optional: Text pulsen
          if (flagText && arrived) {
            const pulse = 1 + 0.02 * Math.sin(performance.now()/120);
            flagText.object3D.scale.set(pulse, pulse, pulse);
          }
        }
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }

    function buildKitchenRoute() {
      clearSceneObjects();

      // Startpunkt (Mockup): Tür -> Start am Boden nahe Kamera
      // Wenn es in deiner Demo „nicht passt“, justiere startX/startZ/startY oder METER.
      const startY = 0.02;
      const startX = 0.0;
      const startZ = -2.0;

      // Küche Route:
      // 1) 3m geradeaus
      const s1 = { x: startX, y: startY, z: startZ };
      const p1 = { x: startX, y: startY, z: startZ - 3*METER };
      addNeonSegment({ start: s1, end: p1, color: '#33a7ff', width: 0.07 });

      // 2) 90° nach links: von „geradeaus Richtung -z“ bedeutet links = +x
      // 3) 7m geradeaus (jetzt entlang +x)
      const p2 = { x: startX + 7*METER, y: startY, z: p1.z };
      addNeonSegment({ start: p1, end: p2, color: '#33a7ff', width: 0.07 });

      // 4) 90° nach links (von +x Richtung links = -z)
      // 5) 3m geradeaus
      const target = { x: p2.x, y: startY, z: p2.z - 3*METER };
      addNeonSegment({ start: p2, end: target, color: '#33a7ff', width: 0.07 });

      // Ziel-Fahne
      targetWorld = { x: target.x, y: target.y, z: target.z };
      const handles = addGoalFlag(target);
      animatePulse();
      statusEl.textContent = '➡️ Küche: Route aktiv. Folge dem Neonpfad…';

      // Falls bereits nah, gleich anzeigen
      startArrivalWatcher();
    }

    function buildBathroomRoute() {
      clearSceneObjects();

      // Einfaches Mockup für Bad (du kannst später genauso genau machen)
      const startY = 0.02;
      const startX = 0.0;
      const startZ = -2.0;

      const m1 = 2*METER;
      const m2 = 2*METER;
      const midZ = startZ - m1;

      addNeonSegment({ start: {x:startX,y:startY,z:startZ}, end:{x:startX,y:startY,z:midZ}, color:'#33a7ff', width:0.07 });

      const endX = startX - m2; // links
      const target = {x:endX, y:startY, z:midZ};
      addNeonSegment({ start: {x:startX,y:startY,z:midZ}, end:{x:endX,y:startY,z:midZ}, color:'#33a7ff', width:0.07 });

      targetWorld = { x: target.x, y: target.y, z: target.z };
      addGoalFlag(target);
      animatePulse();

      statusEl.textContent = '➡️ Bad: (Mockup) Neonpfad aktiv…';
      startArrivalWatcher();
    }

    // --- Overlay hide ---
    const overlay = document.getElementById('overlay');
    const menuCard = document.getElementById('menuCard');

    function hideMenu() {
      menuCard.classList.add('hide');
      setTimeout(() => {
        overlay.style.pointerEvents = 'none';
        overlay.style.opacity = '0';
      }, 360);
    }

    document.getElementById('btnKueche').addEventListener('click', () => {
      hideMenu();
      buildKitchenRoute();
    });

    document.getElementById('btnBad').addEventListener('click', () => {
      hideMenu();
      buildBathroomRoute();
    });

    window.addEventListener('load', () => {
      startCamera();
    });
  </script>

  <!-- A-Frame/Three benötigt THREE explizit im globalen Scope für unsere Vector3-Nutzung -->
  <script>
    window.THREE = window.THREE || AFRAME.THREE;
  </script>
</body>
</html>
